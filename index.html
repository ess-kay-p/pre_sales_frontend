<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/black.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
              <section>
    <div style="display: flex; flex-direction: column; height: 100%;">
        <!-- First row: Heading -->
        <div style="flex: 0 0 auto; margin-bottom: 1em;">
            <h2>The Invisible Key</h2>
        </div>
        <!-- Second row: Three columns with images and captions -->
        <div style="flex: 1 1 auto; display: flex; gap: 2em; justify-content: center;">
            <!-- Column 1 -->
            <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center;">
                <div style="position: relative; width: 100%; display: flex; justify-content: center;">
                    <img src="https://fastly.picsum.photos/id/0/5000/3333.jpg?hmac=_j6ghY5fCfSD6tvtcV74zXivkJSPIfR9B8w34XeQmvU"
                        alt="Mountain Lake"
                        style="max-width: 100%; max-height: 200px; border-radius: 8px; display: block;">
                    <div
                        style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); color: #fff; font-size: 1em; text-align: center; border-radius: 0 0 8px 8px; padding: 0.3em 0;">
                        Unlocking bespoke perks just for you.
                    </div>
                </div>
            </div>
            <!-- Column 2 -->
            <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center;">
                <div style="position: relative; width: 100%; display: flex; justify-content: center;">
                    <img src="https://fastly.picsum.photos/id/0/5000/3333.jpg?hmac=_j6ghY5fCfSD6tvtcV74zXivkJSPIfR9B8w34XeQmvU"
                        alt="Cute Dog"
                        style="max-width: 100%; max-height: 200px; border-radius: 8px; display: block;">
                    <div
                        style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); color: #fff; font-size: 1em; text-align: center; border-radius: 0 0 8px 8px; padding: 0.3em 0;">
                        Experience it all with one tap.
                    </div>
                </div>
            </div>
            <!-- Column 3 -->
            <div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center;">
                <div style="position: relative; width: 100%; display: flex; justify-content: center;">
                    <img src="https://fastly.picsum.photos/id/0/5000/3333.jpg?hmac=_j6ghY5fCfSD6tvtcV74zXivkJSPIfR9B8w34XeQmvU"
                        alt="Forest Path"
                        style="max-width: 100%; max-height: 200px; border-radius: 8px; display: block;">
                    <div
                        style="position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); color: #fff; font-size: 1em; text-align: center; border-radius: 0 0 8px 8px; padding: 0.3em 0;">
                        The journey begins with a personal touch.
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
			<div>		
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>			
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});
		</script>
	</body>
</html>
